version: '3.9'

services:

  # ── PostgreSQL + PostGIS ───────────────────────────────────────────────────
  postgres:
    image: postgis/postgis:16-3.4-alpine
    container_name: keystone-db
    environment:
      POSTGRES_DB: keystone_db
      POSTGRES_USER: keystone_user
      POSTGRES_PASSWORD: keystone_pass
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U keystone_user -d keystone_db"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # ── Spring Boot Backend ────────────────────────────────────────────────────
  backend:
    build:
      context: ./keystone-backend
      dockerfile: Dockerfile
    container_name: keystone-backend
    environment:
      SPRING_PROFILES_ACTIVE: dev
      DB_USER: keystone_user
      DB_PASSWORD: keystone_pass
      DB_URL: jdbc:postgresql://postgres:5432/keystone_db
      JWT_SECRET: a2V5c3RvbmUtc2VjcmV0LWtleS1mb3ItZGV2ZWxvcG1lbnQtb25seS0yNTZiaXRz
      # ── AI Triage ──────────────────────────────────────────────────────────
      OPENAI_API_KEY: ${OPENAI_API_KEY:-demo}
      AI_MODEL_NAME: ${AI_MODEL_NAME:-gpt-4o-mini}
      # ── Email ──────────────────────────────────────────────────────────────
      MAIL_HOST: ${MAIL_HOST:-smtp.sendgrid.net}
      MAIL_PORT: ${MAIL_PORT:-587}
      MAIL_USERNAME: ${MAIL_USERNAME:-apikey}
      MAIL_PASSWORD: ${MAIL_PASSWORD:-}
      MAIL_FROM: ${MAIL_FROM:-noreply@keystone.com}
      # ── Twilio SMS ─────────────────────────────────────────────────────────
      TWILIO_ACCOUNT_SID: ${TWILIO_ACCOUNT_SID:-}
      TWILIO_AUTH_TOKEN: ${TWILIO_AUTH_TOKEN:-}
      TWILIO_FROM_NUMBER: ${TWILIO_FROM_NUMBER:-}
      # ── Frontend URL (for email links) ─────────────────────────────────────
      FRONTEND_URL: http://localhost:3000
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  # ── React Frontend ─────────────────────────────────────────────────────────
  frontend:
    build:
      context: ./keystone-frontend
      dockerfile: Dockerfile
    container_name: keystone-frontend
    environment:
      VITE_API_URL: /api/v1
    ports:
      - "3000:80"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  postgres_data:
