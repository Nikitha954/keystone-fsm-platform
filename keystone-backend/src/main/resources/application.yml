spring:
  application:
    name: keystone-backend
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  
  # Added Database Configuration
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/keystone_db}
    username: ${DB_USER:postgres}
    password: ${DB_PASSWORD} # Ensure this matches your .env file
  
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
        jdbc:
          batch_size: 20
        order_inserts: true
        order_updates: true
  
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

jwt:
  # Pulling the secret securely from the environment
  secret: ${JWT_SECRET}
  expiration: 86400000
  refresh-expiration: 604800000

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
    tags-sorter: alpha

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics

logging:
  level:
    com.keystone: INFO
    org.springframework.security: WARN
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"